name: 朝刊を生成（毎営業日 7:30 JST）

on:
  # 主トリガーは Cloud Scheduler（Asia/Tokyo で 7:30 発火 → workflow_dispatch API）。
  # GitHub の schedule は発火が数時間遅延・脱落することがあるため、あくまでフォールバック。
  # 両者が発火しても generate.mjs が「既に生成済み」でスキップするので二重投稿にはならない。
  schedule:
    # 22:30 UTC (月-金) = 翌朝 7:30 JST (火-土) — 米国市場・NYクローズ後
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# Cloud Scheduler と schedule が近接発火してもプッシュが衝突しないよう直列化する
concurrency:
  group: generate-morning
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      posted: ${{ steps.commit.outputs.posted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 記事を生成
        run: node scripts/generate.mjs morning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
      - name: 米国株の解説を生成
        # 記事本体の生成・デプロイを妨げないよう、失敗しても続行する。
        continue-on-error: true
        run: node scripts/generate-stocks.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
      - name: コミットしてプッシュ
        id: commit
        run: |
          git config user.name "market-daily-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts content/us-stocks.json
          if git diff --cached --quiet; then
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "新しい記事はありません（休場などによるスキップ）"
          else
            git commit -m "post: 朝刊 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
            echo "posted=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: generate
    if: needs.generate.outputs.posted == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write # Google Cloud への OIDC 認証に必要

  announce:
    # サイト公開後にXへ告知（リンク先が生きている状態でポストする）。
    # 告知の失敗で記事生成ワークフローを失敗扱いにしない。
    # X APIはクレジット制（有料）のため既定では無効。IFTTT（RSS→X）で代替中。
    # 有効化するにはリポジトリ変数 X_ANNOUNCE_ENABLED=true を設定（IFTTT側は停止すること）。
    needs: [generate, deploy]
    if: needs.generate.outputs.posted == 'true' && vars.X_ANNOUNCE_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # generate ジョブが push した最新コミット（新記事入り）を取得する
      - name: Xへ告知ポスト
        run: node scripts/post-to-x.mjs morning
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
